services:
  # Single-node replica set: MongoDB multi-document ACID transactions REQUIRE a replica set.
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once a primary exists.
      test: >
        mongosh --quiet --eval "
        try { quit(rs.status().ok ? 0 : 1) } catch (e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]});
          quit(1)
        }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: "4000"
      MONGO_URI: mongodb://mongo:27017/heritage?replicaSet=rs0
      # DEMO ONLY - generate your own secret for any real deployment.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-0123456789abcdef}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      SEED_ON_START: "true"
      SEED_ADMIN_EMAIL: admin@heritage.test
      SEED_ADMIN_PASSWORD: Admin@12345
      AUTH_RATE_LIMIT_MAX: "500"
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mongo-data:
